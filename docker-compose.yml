services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hackathon}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hackathon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Load-test note (TASK-16): the container's internal file-descriptor limit
    # is 1M+ on Linux hosts, so the server side is fine under S2 fanout (1000
    # members). The bottleneck is the *client* harness: Locust running on a
    # macOS host defaults to `ulimit -n 256`, which caps concurrent WS clients
    # well below the scenario's needs. Before launching Locust on the host,
    # run `ulimit -n 8192` in the harness shell. Do NOT attempt to set ulimits
    # on this container — it's not the problem.
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hackathon}
      SECRET_KEY: ${SECRET_KEY:-changeme}
      UPLOAD_DIR: ${UPLOAD_DIR:-/uploads}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-'["http://localhost:5173","http://localhost:3000","http://frontend:5173"]'}
    volumes:
      - uploads_data:/uploads
    command:
      [
        "sh", "-c",
        "uv run alembic upgrade head && exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --ws-ping-interval 20 --ws-ping-timeout 30"
      ]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
